server:
  address: 127.0.0.1
spring:
  datasource:
    url: ${MOCK_DB_URL:}
    username: ${MOCK_DB_USER:}
    password: ${MOCK_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
app:
  jwt:
    secret: ${MOCK_JWT_SECRET:}
payos:
  mode: MOCK
  mock-database: ${MOCK_DB_SCHEMA:}
  mock-verified: false
  mock-jwt-secret: ${MOCK_JWT_SECRET:}
  client-id: ''
  api-key: ''
  checksum-key: ''
  mock-enabled: false
  mock-frontend-origin: http://localhost:5173
